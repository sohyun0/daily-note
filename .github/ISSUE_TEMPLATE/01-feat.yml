name: "✨ 기능 추가 (feat)"
description: "새로운 기능이나 API 연동, 화면 로직을 추가할 때 사용합니다."
title: "[FEAT] "
labels: ["✨ feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "📋 작업 개요"
      description: "어떤 기능을 왜 추가하는지 간단히 설명해 주세요."
      placeholder: "예) 하루노트 작성 및 수정 폼 기능을 추가합니다."
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: "🎯 상세 요구사항"
      description: "구현해야 할 세부 기능이나 비즈니스 로직을 체크리스트로 적어 주세요."
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "🔗 관련 디자인 / API 명세 (선택)"
      description: "Figma 링크, API 엔드포인트 문서 등이 있다면 첨부해 주세요."
      placeholder: |
        - Figma: 
        - API:

  - type: textarea
    id: acceptance
    attributes:
      label: "✅ 완료 조건 (Acceptance Criteria)"
      description: "어떤 상태가 되면 이 이슈가 완료된 것인지 기준을 적어 주세요."
      value: |
        - [ ] 
        - [ ]

  - type: markdown
    attributes:
      value: |
        ---
        🌿 **작업 브랜치 예시**: `feat/#이슈번호-작업설명`
