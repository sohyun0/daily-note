name: "🔧 설정 / 환경 / CI (chore)"
description: "패키지 설치, 빌드/린트 설정, CI/CD 워크플로, 폴더/파일 정리 등 개발 환경 작업 시 사용합니다."
title: "[CHORE] "
labels: ["🔧 chore"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: "⚙️ 작업 목적"
      description: "어떤 설정이나 환경을 왜 추가/변경하는지 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📦 상세 작업 내역"
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "⚠️ 영향 범위 및 주의사항 (선택)"
      description: "환경변수(.env.example) 추가 여부, npm install 재실행 필요 여부 등을 적어 주세요."

  - type: markdown
    attributes:
      value: |
        ---
        🌿 **작업 브랜치 예시**: `chore/#이슈번호-작업설명` (CI 작업인 경우 `ci/#이슈번호-작업설명`)
