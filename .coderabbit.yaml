# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 1. 무조건 한국어로 리뷰 및 요약 작성
language: "ko-KR"

tone_instructions: "모든 PR 요약, 다이어그램 설명, 코드 리뷰 코멘트는 반드시 한국어로 친절하고 구체적으로 작성해 주세요. 컨벤션 위반이나 버그 가능성을 발견하면 왜 문제인지와 함께 수정 예시 코드를 제시해 주세요."

early_access: false

reviews:
  # 꼼꼼한 리뷰 수준 (chill | assertive)
  profile: "assertive"
  # 코드래빗 코멘트가 해결되면 자동으로 Approve 처리하지 않고 리뷰만 남김
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # 2. 리뷰에서 제외할 파일/폴더 패턴 (! 접두사는 제외를 의미)
  path_filters:
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!public/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.avif"
    - "!**/*.ico"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!.storybook/**"
    - "!storybook-static/**"
    - "!src/stories/**"
    - "!**/*.stories.ts"
    - "!**/*.stories.tsx"
    - "!**/*.mdx"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
    - "!labels.json"
    - "!.husky/**"
    - "!.vscode/**"

  # 3. 하루노트(DAILY NOTE) 프로젝트 컨벤션 주입
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        하루노트(DAILY NOTE) 프로젝트의 아래 컨벤션(AGENTS.md 및 docs/conventions/*)을 엄격히 준수했는지 리뷰해 주세요:

        1. [폴더 및 아키텍처 경계]
           - 의존 방향은 반드시 `app -> features -> shared` 단방향이어야 합니다.
           - `src/features/<기능명>` 끼리는 절대 서로 import 할 수 없습니다. 공유 코드는 `src/shared`로 올려야 합니다.
           - `src/shared`는 `features`나 `app`을 import 할 수 없습니다.
           - 같은 feature 내부는 상대 경로(`./`, `../`), 다른 계층은 `@/` 별칭을 사용합니다.
           - 컴포넌트, 훅, API, 타입은 모두 폴더 단위로 만들고 파일명은 `index.tsx` 또는 `index.ts`로 작성합니다. (예외: Next.js `app/` 라우트 예약 파일 및 Server Action `camelCase.ts`)

        2. [네이밍 컨벤션]
           - 변수: `camelCase`, 상수: `UPPER_SNAKE_CASE`, 컴포넌트 폴더 및 함수명: `PascalCase`
           - 일반 폴더: `lowercase`, 단어가 합쳐진 기능/복합 폴더: `camelCase`
           - 이벤트 핸들러 함수: `handle` + 대상 + 행동 (예: `handleButtonClick`, `handleNameChange`)
           - API 호출 함수: `get` / `post` / `put` / `patch` / `delete` + 대상 (예: `getArticleDetail`)
           - boolean 변수/상태: `is` 접두사를 최우선으로 사용하고, 불가피한 경우에만 `has`를 사용합니다. (예: `[isLocked, setIsLocked]`)

        3. [함수 및 컴포넌트 작성 스타일]
           - 페이지 및 컴포넌트 함수는 반드시 함수 선언문(`function Comp() {}`)을 사용합니다.
           - 그 외 모든 함수(훅, 유틸리티, API, 이벤트 핸들러 등)는 화살표 함수(`const fn = () => {}`)를 사용합니다.
           - `'use client'`는 필요한 경우 파일 최상단 첫 줄에만 위치해야 합니다.
           - Props destructuring은 함수 파라미터에서 바로 수행합니다.
           - 복잡한 삼항 연산자나 중첩 조건문 대신 Early Return 패턴을 우선 사용합니다.

        4. [TypeScript 및 가독성]
           - `any` 사용은 절대 금지합니다. 타입을 모를 때는 `unknown`과 타입 가드를 사용합니다.
           - 객체 타입은 `interface`를 우선 사용하고, 유니온/교차 타입에만 `type`을 사용합니다.
           - 컴포넌트의 Props `interface`는 같은 파일의 컴포넌트 함수 바로 위에 선언합니다. 여러 곳에서 반복 사용되는 타입만 `types/` 폴더로 분리합니다.
           - 매직 넘버는 `UPPER_SNAKE_CASE` 상수로 분리하고, 복잡한 조건식은 `is`/`has`로 시작하는 명명된 boolean 변수로 추출합니다.

        5. [5단계 Import 순서]
           - 그룹 간 빈 줄을 두고 다음 순서를 지켜야 합니다:
             1) React / Next.js (`react`, `next/*`)
             2) 외부 라이브러리 (`@tanstack/*`, `zustand`, `zod`, `react-hook-form` 등)
             3) 내부 모듈 (`@/*`)
             4) 상대 경로 (`./`, `../`, `./index.module.scss`)
             5) 타입 import (`import type ...`)

    - path: "src/**/*.scss"
      instructions: |
        - SCSS Modules(`*.module.scss`) 규칙을 따르며, 클래스명은 `camelCase`로 작성했는지 확인해 주세요.
        - 불필요하게 깊은 중첩(3단계 초과)이나 하드코딩된 매직 값 대신 재사용 가능한 구조인지 확인해 주세요.

  # 4. 어떤 브랜치(develop, main 등 모든 타겟 브랜치)로 PR을 올리든 자동 리뷰 실행
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"

chat:
  auto_reply: true
